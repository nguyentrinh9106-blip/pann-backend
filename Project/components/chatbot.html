<div id="chatbot-wrapper">
    <button id="chatbot-toggle" class="shadow-lg">
        <i class="bi bi-chat-dots-fill"></i>
    </button>

    <div id="chatbot-container" class="shadow-lg d-none">
        <div id="chatbot-header" class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <div class="bot-avatar me-2">P</div>
                <span class="fw-bold">Trợ lý PÀNN</span>
            </div>
            <button id="chatbot-close" class="btn btn-sm text-white"><i class="bi bi-dash-lg"></i></button>
        </div>
        
        <div id="chatbot-messages">
            <div class="message bot">Chào bạn! Mình là trợ lý ảo của PÀNN. Bạn cần tư vấn về sản phẩm nào ạ?</div>
        </div>

        <div id="chatbot-input-area" class="input-group">
            <input type="text" id="chatbot-input" class="form-control" placeholder="Nhập câu hỏi...">
            <button id="chatbot-send" class="btn btn-accent"><i class="bi bi-send"></i></button>
        </div>
    </div>
</div>
